[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corvustunnel"
version = "0.4.0"
description = "AI Agent Control with Voice — Talk to Your Code. Control Claude, Codex, and Antigravity from anywhere."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "CorvusTunnel", email = "hello@corvustunnel.com"},
]
keywords = [
    "ai", "agent", "terminal", "remote", "claude", "codex", "antigravity",
    "voice", "telegram", "coding", "mobile", "self-hosted",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Tools",
    "Topic :: System :: Networking",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pexpect>=4.9.0; sys_platform != 'win32'",
    "pywinpty>=2.0.0; sys_platform == 'win32'",
    "qrcode>=7.4.0",
    "slowapi>=0.1.9",
    "PyNaCl>=1.5.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
voice = [
    "edge-tts>=6.1.0",
    "openai-whisper>=20231117",
    "python-telegram-bot>=21.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://corvustunnel.com"
Documentation = "https://corvustunnel.com/docs"
Repository = "https://github.com/corvustunnel/corvustunnel"
Issues = "https://github.com/corvustunnel/corvustunnel/issues"
Changelog = "https://github.com/corvustunnel/corvustunnel/blob/main/CHANGELOG.md"

[project.scripts]
corvustunnel = "cli:main"

[tool.setuptools]
packages = [
    "auth",
    "audit",
    "config",
    "executor",
    "licensing",
    "middleware",
    "routers",
    "crypto",
    "integrations",
]
py-modules = [
    "cli",
    "main",
    "boot",
    "public_app",
    "internal_app",
]

[tool.setuptools.package-data]
"*" = ["*.key", "*.html", "*.css", "*.js", "*.svg", "*.png", "*.ico"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
