[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corvustunnel"
dynamic = ["version"]
description = "Control AI coding agents from your phone — Claude Code, Codex, and Antigravity. Self-hosted, E2E encrypted, open source."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "KALAI", email = "hello@kalai-tech.com"},
]
keywords = [
    "ai", "agent", "terminal", "remote", "claude", "codex", "antigravity",
    "coding", "mobile", "self-hosted", "pwa",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Networking",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pexpect>=4.9.0; sys_platform != 'win32'",
    "pywinpty>=2.0.0; sys_platform == 'win32'",
    "qrcode>=7.4.0",
    "slowapi>=0.1.9",
    "PyNaCl>=1.5.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "httpx",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://corvustunnel.com"
Documentation = "https://corvustunnel.com"
Repository = "https://github.com/maliozturk/CorvusTunnel"
Issues = "https://github.com/maliozturk/CorvusTunnel/issues"
Changelog = "https://github.com/maliozturk/CorvusTunnel/blob/main/CHANGELOG.md"

[project.scripts]
corvustunnel = "corvustunnel.cli:main"

[tool.setuptools.packages.find]
include = ["corvustunnel*"]

[tool.setuptools.dynamic]
version = {attr = "corvustunnel.__version__"}

[tool.setuptools.package-data]
"corvustunnel" = [
    "static/*", "static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
