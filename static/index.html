<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="/static/vendor/xterm.css">

<style>
/* ===== CSS Custom Properties ===== */
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-tertiary: #1a1a2e;
  --bg-card: rgba(255, 255, 255, 0.03);
  --bg-card-hover: rgba(255, 255, 255, 0.06);
  --glass-bg: rgba(18, 18, 26, 0.7);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-border-light: rgba(255, 255, 255, 0.12);

  --purple: #8b5cf6;
  --purple-dim: #7c3aed;
  --purple-glow: rgba(139, 92, 246, 0.3);
  --purple-soft: rgba(139, 92, 246, 0.12);

  --blue-dark: #1e293b;
  --blue-deep: #0f172a;

  --cyan: #06b6d4;
  --cyan-glow: rgba(6, 182, 212, 0.25);
  --cyan-soft: rgba(6, 182, 212, 0.1);

  --green: #22c55e;
  --green-glow: rgba(34, 197, 94, 0.3);
  --red: #ef4444;
  --red-glow: rgba(239, 68, 68, 0.3);
  --yellow: #eab308;
  --yellow-glow: rgba(234, 179, 8, 0.3);
  --orange: #f97316;

  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --text-dim: #475569;

  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
  --shadow-glow-purple: 0 0 20px var(--purple-glow);
  --shadow-glow-cyan: 0 0 20px var(--cyan-glow);

  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);

  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

/* ===== Reset & Base ===== */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  height: 100%;
  height: 100dvh;
  overflow: hidden;
}

body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  position: fixed;
  width: 100%;
  top: 0;
  left: 0;
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: var(--radius-full); }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ===== Animations ===== */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(24px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(30px) scale(0.95); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}

@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-30px) scale(0.95); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

@keyframes glow {
  0%, 100% { box-shadow: 0 0 5px var(--purple-glow), 0 0 10px rgba(139,92,246,0.1); }
  50% { box-shadow: 0 0 15px var(--purple-glow), 0 0 30px rgba(139,92,246,0.15); }
}

@keyframes dotBounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.02); }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

@keyframes textReveal {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Auth Screen ===== */
.auth-screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg-primary);
  z-index: 1000;
  animation: fadeIn 0.6s ease;
  padding: 24px;
  overflow: hidden;
}

.auth-screen::before {
  content: '';
  position: absolute;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--purple-glow) 0%, transparent 70%);
  top: -150px;
  right: -100px;
  pointer-events: none;
  animation: breathe 6s ease-in-out infinite;
}

.auth-screen::after {
  content: '';
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--cyan-glow) 0%, transparent 70%);
  bottom: -100px;
  left: -80px;
  pointer-events: none;
  animation: breathe 8s ease-in-out infinite 2s;
}

.auth-card {
  width: 100%;
  max-width: 380px;
  background: var(--glass-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-xl);
  padding: 40px 28px;
  position: relative;
  z-index: 1;
  animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}

.auth-logo {
  text-align: center;
  margin-bottom: 32px;
}

.auth-logo-icon {
  width: 64px;
  height: 64px;
  margin: 0 auto 16px;
  background: linear-gradient(135deg, var(--purple), var(--cyan));
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  box-shadow: var(--shadow-glow-purple);
  animation: float 4s ease-in-out infinite;
  position: relative;
}

.auth-logo-icon::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: calc(var(--radius-lg) + 2px);
  background: linear-gradient(135deg, var(--purple), var(--cyan));
  z-index: -1;
  opacity: 0.4;
  filter: blur(8px);
}

.auth-title {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.auth-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 6px;
  font-weight: 400;
}

.auth-field {
  margin-bottom: 20px;
}

.auth-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.auth-input {
  width: 100%;
  padding: 14px 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 14px;
  outline: none;
  transition: all var(--transition-normal);
}

.auth-input:focus {
  border-color: var(--purple);
  box-shadow: 0 0 0 3px var(--purple-soft), var(--shadow-glow-purple);
  background: rgba(255,255,255,0.06);
}

.auth-input::placeholder {
  color: var(--text-dim);
}

.auth-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--purple), var(--purple-dim));
  border: none;
  border-radius: var(--radius-md);
  color: white;
  font-family: var(--font-sans);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition-normal);
  position: relative;
  overflow: hidden;
}

.auth-btn:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-glow-purple), var(--shadow-md);
}

.auth-btn:active {
  transform: translateY(0) scale(0.98);
}

.auth-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  background-size: 200% 100%;
  animation: shimmer 3s infinite;
}

.auth-error {
  margin-top: 16px;
  padding: 10px 14px;
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.2);
  border-radius: var(--radius-sm);
  color: var(--red);
  font-size: 13px;
  text-align: center;
  animation: slideUp 0.3s ease;
  display: none;
}

.auth-error.visible { display: block; }

/* ===== App Layout ===== */
.app {
  display: none;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
  position: relative;
  overflow: hidden;
}

.app.active {
  display: flex;
  animation: fadeIn 0.4s ease;
}

/* ===== Header ===== */
.header {
  flex-shrink: 0;
  padding: 12px 16px;
  padding-top: calc(12px + var(--safe-top));
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 10;
}

.header::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--purple-glow), var(--cyan-glow), transparent);
  opacity: 0.5;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--purple), var(--cyan));
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  box-shadow: 0 0 12px var(--purple-glow);
}

.header-info {
  display: flex;
  flex-direction: column;
}

.header-title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.3px;
  line-height: 1.2;
}

.header-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-dim);
  transition: all var(--transition-normal);
  position: relative;
}

.status-dot.connected {
  background: var(--green);
  box-shadow: 0 0 8px var(--green-glow);
}

.status-dot.connected::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: var(--green);
  opacity: 0.3;
  animation: pulse 2s infinite;
}

.status-dot.disconnected {
  background: var(--red);
  box-shadow: 0 0 6px var(--red-glow);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 16px;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.header-btn:hover {
  background: rgba(255,255,255,0.1);
  color: var(--text-primary);
}

.header-btn:active {
  transform: scale(0.92);
}



/* ===== Browse Button ===== */
.browse-btn {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 15px;
  cursor: pointer;
  transition: all var(--transition-fast);
}
.browse-btn:hover {
  background: rgba(6,182,212,0.12);
  color: var(--cyan);
  border-color: rgba(6,182,212,0.4);
}
.browse-btn:active { transform: scale(0.9); }

/* ===== Folder Browser Modal ===== */
.folder-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.folder-modal.active {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn 0.15s ease;
}
@media (min-width: 768px) {
  .folder-modal.active { align-items: center; }
}
.folder-panel {
  width: 100%;
  max-width: 480px;
  max-height: 75dvh;
  background: var(--bg-secondary);
  border: 1px solid var(--glass-border-light);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  display: flex;
  flex-direction: column;
  animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
}
@media (min-width: 768px) {
  .folder-panel {
    border-radius: var(--radius-xl);
    max-height: 65vh;
  }
}
.folder-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.folder-header-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.folder-close {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 18px;
  cursor: pointer;
  transition: all var(--transition-fast);
}
.folder-close:hover {
  background: rgba(239,68,68,0.12);
  color: var(--red);
  border-color: rgba(239,68,68,0.3);
}
.folder-path {
  padding: 10px 20px;
  background: rgba(0,0,0,0.25);
  border-bottom: 1px solid var(--glass-border);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--cyan);
  word-break: break-all;
  flex-shrink: 0;
  line-height: 1.4;
}
.folder-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
  -webkit-overflow-scrolling: touch;
}
.folder-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 20px;
  color: var(--text-secondary);
  font-size: 14px;
  cursor: pointer;
  transition: all var(--transition-fast);
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-family: var(--font-sans);
}
.folder-item:hover {
  background: rgba(139,92,246,0.08);
  color: var(--text-primary);
}
.folder-item:active { background: rgba(139,92,246,0.14); }
.folder-item-icon {
  font-size: 17px;
  flex-shrink: 0;
  width: 24px;
  text-align: center;
}
.folder-item.up-dir { color: var(--text-muted); }
.folder-item.up-dir:hover { color: var(--cyan); }
.folder-empty {
  padding: 36px 20px;
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
}
.folder-actions {
  padding: 12px 20px;
  border-top: 1px solid var(--glass-border);
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
.folder-select-btn {
  flex: 1;
  padding: 12px;
  background: linear-gradient(135deg, var(--purple), var(--purple-dim));
  border: none;
  border-radius: var(--radius-md);
  color: white;
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition-normal);
}
.folder-select-btn:hover {
  box-shadow: var(--shadow-glow-purple);
  transform: translateY(-1px);
}
.folder-select-btn:active { transform: scale(0.97); }
.folder-cancel-btn {
  padding: 12px 20px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition-fast);
}
.folder-cancel-btn:hover {
  background: rgba(255,255,255,0.1);
  color: var(--text-primary);
}
.folder-loading {
  padding: 36px 20px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}
.folder-loading::after {
  content: '';
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid var(--glass-border);
  border-top-color: var(--purple);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  margin-left: 8px;
  vertical-align: middle;
}



#terminalPanel {
  position: relative;
}

#terminalContainer {
  flex: 1;
  overflow: hidden;
  padding: 4px;
  background: #0a0a0f;
  border-top: 1px solid var(--glass-border);
}

/* Override xterm.js background to match our theme */
#terminalContainer .xterm {
  padding: 8px;
}

/* ===== Terminal Status Bar ===== */
.term-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  background: var(--glass-bg);
  border-top: 1px solid var(--glass-border);
  border-bottom: 1px solid var(--glass-border);
  flex-shrink: 0;
}

.term-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
}

.term-status .status-dot {
  width: 6px;
  height: 6px;
}

.term-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}

.term-ctrl-btn {
  padding: 4px 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: 11px;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.term-ctrl-btn:hover {
  background: rgba(255,255,255,0.1);
  color: var(--text-primary);
}

.term-ctrl-btn:active { transform: scale(0.93); }

.term-font-select {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 3px 6px;
  cursor: pointer;
  outline: none;
}

.term-font-select option {
  background: var(--bg-secondary);
  color: var(--text-primary);
}

/* ===== URL Toast (floating link detector) ===== */
.url-toast {
  display: none;
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  background: linear-gradient(135deg, rgba(99,102,241,0.95), rgba(139,92,246,0.95));
  color: #fff;
  padding: 10px 20px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 8px 32px rgba(99,102,241,0.4);
  backdrop-filter: blur(12px);
  animation: toastSlide 0.3s ease;
  max-width: 90vw;
  text-align: center;
  text-decoration: none;
}
.url-toast:active {
  transform: translateX(-50%) scale(0.96);
}
.url-toast .toast-dismiss {
  margin-left: 12px;
  opacity: 0.7;
  font-size: 18px;
  vertical-align: middle;
}
@keyframes toastSlide {

<script>
/* ==========================================================================
   CorvusTunnel — Secure Agy Launcher
   ========================================================================== */

/* ---------- state ---------- */
const STATE = {
  token: localStorage.getItem('corvus_token') || '',
  connected: false,
  healthTimer: null,
  agyAvailable: false,
  phase: 'launcher', // 'launcher' | 'terminal'
};

/* ---------- DOM refs ---------- */
const $ = id => document.getElementById(id);
const connDot  = $('connectionDot');
const connText = $('connectionText');

/* ==========================================================================
   Auth
   ========================================================================== */
function handleAuth() {
  var t = $('tokenInput').value.trim();
  if (!t) { showAuthErr('Please enter a valid token.'); return; }
  claimAndBoot(t);
}

async function claimAndBoot(token) {
  // Try to claim boot token for a session token
  try {
    var resp = await fetch('/api/claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token }),
    });
    if (resp.ok) {
      var data = await resp.json();
      STATE.token = data.session_token;
      localStorage.setItem('corvus_token', data.session_token);
      bootApp();
      return;
    }
    // If claim fails (already consumed), try token directly as session token
    STATE.token = token;
    localStorage.setItem('corvus_token', token);
    // Verify it works
    var health = await fetch('/api/health');
    if (health.ok) {
      bootApp();
    } else {
      showAuthErr('Token rejected — it may have already been used.');
    }
  } catch (e) {
    showAuthErr('Connection error: ' + e.message);
  }
}

function handleLogout() {
  STATE.token = '';
  localStorage.removeItem('corvus_token');
  clearInterval(STATE.healthTimer);
  if (TERMINAL.ws) { TERMINAL.ws.close(); TERMINAL.ws = null; }
  if (TERMINAL.pingInterval) { clearInterval(TERMINAL.pingInterval); }
  clearTimeout(TERMINAL.reconnectTimer);
  $('app').classList.remove('active');
  $('authScreen').style.display = 'flex';
  $('tokenInput').value = '';
  $('authError').classList.remove('visible');
  showPhase('launcher');
}

function showAuthErr(msg) {
  const e = $('authError');
  e.textContent = msg;
  e.classList.add('visible');
}

function bootApp() {
  $('authScreen').style.display = 'none';
  $('app').classList.add('active');
  startHealth();
  checkAgyAvailability();

  // Restore saved folder
  const wd = $('workDirInput').value.trim();
  updateLauncherFolder(wd);

  showPhase('launcher');
}

/* ==========================================================================
   Phase Management
   ========================================================================== */
function showPhase(phase) {
  STATE.phase = phase;
  if (phase === 'launcher') {
    $('launcherScreen').classList.remove('hidden');
    $('launcherScreen').style.display = '';
    $('terminalScreen').classList.add('hidden');
    $('terminalScreen').style.display = 'none';
    updateConnectButton();
    releaseWakeLock();
  } else {
    $('launcherScreen').classList.add('hidden');
    $('launcherScreen').style.display = 'none';
    $('terminalScreen').classList.remove('hidden');
    $('terminalScreen').style.display = 'flex';
    if (TERMINAL.fitAddon) {
      setTimeout(function() { TERMINAL.fitAddon.fit(); sendResize(); }, 100);
    }
    acquireWakeLock();
  }
}

/* ── Screen Wake Lock ─────────────────────────────────────────────── */
var _wakeLock = null;

async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return; // Unsupported browser
  try {
    _wakeLock = await navigator.wakeLock.request('screen');
    _wakeLock.addEventListener('release', function() { _wakeLock = null; });
    console.log('[wakelock] Screen wake lock acquired');
  } catch (e) {
    console.warn('[wakelock] Failed to acquire:', e.message);
  }
}

function releaseWakeLock() {
  if (_wakeLock) {
    _wakeLock.release();
    _wakeLock = null;
    console.log('[wakelock] Screen wake lock released');
  }
}

// Re-acquire wake lock when page becomes visible again (e.g. tab switch)
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible' && STATE.phase === 'terminal') {
    acquireWakeLock();
  }
});

/* ==========================================================================
   Launcher
   ========================================================================== */
function updateLauncherFolder(path) {
  const nameEl = $('launcherFolderName');
  if (path) {
    // Show last segment as name
    var name = path.split('\\').pop() || path.split('/').pop() || path;
    nameEl.textContent = name;
    nameEl.classList.remove('empty');
    nameEl.title = path;
  } else {
    nameEl.textContent = 'No folder selected';
    nameEl.classList.add('empty');
    nameEl.title = '';
  }
  updateConnectButton();
}

async function checkAgyAvailability() {
  try {
    var r = await api('/api/check-agy');
    var data = await r.json();
    STATE.agyAvailable = data.available;
  } catch (e) {
    STATE.agyAvailable = false;
  }
  updateConnectButton();
}

function updateConnectButton() {
  var btn = $('connectBtn');
  var text = $('connectBtnText');
  var hint = $('connectHint');
  var hasFolder = !!$('workDirInput').value.trim();

  if (!STATE.agyAvailable) {
    btn.disabled = true;
    text.textContent = 'agy not available';
    hint.textContent = 'Install agy first to use this terminal';
  } else if (!hasFolder) {
    btn.disabled = true;
    text.textContent = 'Select a folder first';
    hint.textContent = 'Choose a project directory to get started';
  } else {
    btn.disabled = false;
    text.textContent = '\u26A1 Connect Agy Terminal';
    hint.textContent = '';
  }
}

function handleConnect() {
  var wd = $('workDirInput').value.trim();
  if (!wd || !STATE.agyAvailable) return;

  // Init terminal if needed
  if (!TERMINAL.initialized) {
    initTerminal();
    TERMINAL.initialized = true;
  }

  // Update quick bar
  var name = wd.split('\\').pop() || wd.split('/').pop() || wd;
  $('qbFolderName').textContent = name;
  $('qbFolderName').title = wd;

  showPhase('terminal');

  // Build flags
  var flags = [];
  if ($('optAutoApprove').checked) flags.push('--dangerously-skip-permissions');

  connectTerminalWS(wd, flags);
}

/* ==========================================================================
   Health
   ========================================================================== */
function startHealth() {
  checkHealth();
  STATE.healthTimer = setInterval(checkHealth, 15000);
}

async function checkHealth() {
  try {
    const r = await fetch('/health', { signal: AbortSignal.timeout(5000) });
    setConn(r.ok);
  } catch { setConn(false); }
}

function setConn(ok) {
  STATE.connected = ok;
  connDot.className = 'status-dot ' + (ok ? 'connected' : 'disconnected');
  connText.textContent = ok ? 'Connected' : 'Disconnected';
}

/* ==========================================================================
   API helper
   ========================================================================== */
function authHdr() {
  return { Authorization: 'Bearer ' + STATE.token, 'Content-Type': 'application/json' };
}

async function api(url, opts) {
  opts = opts || {};
  const r = await fetch(url, {
    ...opts,
    headers: { ...authHdr(), ...(opts.headers || {}) },
    signal: opts.signal || AbortSignal.timeout(30000),
  });
  if (r.status === 401 || r.status === 403) {
    handleLogout();
    showAuthErr('Session expired. Please re-authenticate.');
    throw new Error('Unauthorized');
  }
  return r;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ==========================================================================
   WebSocket Terminal Controller
   ========================================================================== */

const TERMINAL = {
  ws: null,
  term: null,
  fitAddon: null,
  ctrlActive: false,
  altActive: false,
  pingInterval: null,
  reconnectTimer: null,
  reconnectAttempt: 0,
  maxReconnect: 10,
  initialized: false,
  userExited: false,
};

function initTerminal() {
  const term = new Terminal({
    cursorBlink: true,
    cursorStyle: 'bar',
    fontSize: 14,
    fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace",
    theme: {
      background: '#0a0a0f',
      foreground: '#f1f5f9',
      cursor: '#8b5cf6',
      cursorAccent: '#0a0a0f',
      selectionBackground: 'rgba(139, 92, 246, 0.35)',
      black: '#1a1a2e',
      red: '#ef4444',
      green: '#22c55e',
      yellow: '#eab308',
      blue: '#3b82f6',
      magenta: '#8b5cf6',
      cyan: '#06b6d4',
      white: '#f1f5f9',
      brightBlack: '#64748b',
      brightRed: '#f87171',
      brightGreen: '#4ade80',
      brightYellow: '#fde047',
      brightBlue: '#60a5fa',
      brightMagenta: '#a78bfa',
      brightCyan: '#22d3ee',
      brightWhite: '#ffffff',
    },
    scrollback: 5000,
    allowProposedApi: true,
  });

  const fitAddon = new FitAddon.FitAddon();
  const webLinksAddon = new WebLinksAddon.WebLinksAddon();
  term.loadAddon(fitAddon);
  term.loadAddon(webLinksAddon);
  term.open($('terminalContainer'));
  fitAddon.fit();

  term.onData(function(data) {
    if (!TERMINAL.ws || TERMINAL.ws.readyState !== WebSocket.OPEN) return;

    if (TERMINAL.ctrlActive && data.length === 1) {
      const code = data.toUpperCase().charCodeAt(0);
      if (code >= 64 && code <= 95) {
        data = String.fromCharCode(code - 64);
      }
      TERMINAL.ctrlActive = false;
      $('vkCtrl').classList.remove('active');
    }
    if (TERMINAL.altActive && data.length === 1) {
      data = '\x1b' + data;
      TERMINAL.altActive = false;
      $('vkAlt').classList.remove('active');
    }

    TERMINAL.ws.send(JSON.stringify({ type: 'input', data: data }));
  });

  TERMINAL.term = term;
  TERMINAL.fitAddon = fitAddon;

  function onResize() {
    if (!TERMINAL.fitAddon || STATE.phase !== 'terminal') return;
    TERMINAL.fitAddon.fit();
    sendResize();
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function() { setTimeout(onResize, 200); });
}

function connectTerminalWS(workDir, flags) {
  if (TERMINAL.ws && TERMINAL.ws.readyState === WebSocket.OPEN) {
    TERMINAL.ws.close();
  }

  TERMINAL.userExited = false;
  clearTimeout(TERMINAL.reconnectTimer);
  if (TERMINAL.pingInterval) { clearInterval(TERMINAL.pingInterval); TERMINAL.pingInterval = null; }

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  var url = proto + '://' + location.host + '/api/terminal/ws'
    + '?token=' + encodeURIComponent(STATE.token)
    + '&work_dir=' + encodeURIComponent(workDir);
  if (flags && flags.length > 0) {
    url += '&flags=' + encodeURIComponent(flags.join(','));
  }

  setQBStatus('connecting');
  if (TERMINAL.term) {
    TERMINAL.term.writeln('\r\n\x1b[33mConnecting to ' + workDir + '...\x1b[0m\r\n');
  }

  const ws = new WebSocket(url);
  TERMINAL.ws = ws;

  ws.onopen = function() {
    TERMINAL.reconnectAttempt = 0;
    setQBStatus('connected');
    sendResize();
    TERMINAL.pingInterval = setInterval(function() {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'ping' }));
      }
    }, 15000);
  };

  ws.onmessage = function(ev) {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'output' || msg.type === 'replay') {
        if (TERMINAL.term && msg.data) {
          TERMINAL.term.write(msg.data);
          detectUrl(msg.data);
        }
      } else if (msg.type === 'exited') {
        setQBStatus('exited');
        if (TERMINAL.term) {
          TERMINAL.term.writeln('\r\n\x1b[31m[agy exited with code ' + (msg.code ?? '?') + ']\x1b[0m');
        }
        // Auto-return to launcher after exit
        setTimeout(function() { backToLauncher(); }, 2000);
      }
    } catch (e) {
      console.warn('[terminal] parse error', e);
    }
  };

  ws.onclose = function() {
    if (TERMINAL.pingInterval) { clearInterval(TERMINAL.pingInterval); TERMINAL.pingInterval = null; }
    setQBStatus('disconnected');

    // Don't auto-reconnect if user explicitly exited
    if (TERMINAL.userExited) return;

    if (TERMINAL.reconnectAttempt < TERMINAL.maxReconnect) {
      const delay = Math.min(1000 * Math.pow(2, TERMINAL.reconnectAttempt), 30000);
      TERMINAL.reconnectAttempt++;
      if (TERMINAL.term) {
        TERMINAL.term.writeln('\r\n\x1b[33mDisconnected. Reconnecting in ' + (delay/1000) + 's... (attempt ' + TERMINAL.reconnectAttempt + ')\x1b[0m');
      }
      TERMINAL.reconnectTimer = setTimeout(function() {
        const wd = $('workDirInput').value.trim();
        if (wd) connectTerminalWS(wd, []);
      }, delay);
    } else {
      if (TERMINAL.term) {
        TERMINAL.term.writeln('\r\n\x1b[31mMax reconnection attempts reached.\x1b[0m');
      }
      setTimeout(function() { backToLauncher(); }, 2000);
    }
  };

  ws.onerror = function() {};
}

/* ── Quick Action Bar ───────────────────────────────────────────────── */
function setQBStatus(state) {
  var statusEl = $('qbStatus');
  var textEl = $('qbStatusText');
  if (state === 'connected') {
    statusEl.classList.remove('disconnected');
    statusEl.classList.add('status');
    statusEl.style.borderColor = 'rgba(34,197,94,0.2)';
    statusEl.style.color = 'var(--green)';
    textEl.textContent = 'Connected';
  } else if (state === 'connecting') {
    statusEl.style.borderColor = 'rgba(234,179,8,0.2)';
    statusEl.style.color = 'var(--yellow)';
    textEl.textContent = 'Connecting...';
  } else if (state === 'disconnected') {
    statusEl.style.borderColor = 'rgba(239,68,68,0.2)';
    statusEl.style.color = 'var(--red)';
    textEl.textContent = 'Disconnected';
  } else if (state === 'exited') {
    statusEl.style.borderColor = 'rgba(239,68,68,0.2)';
    statusEl.style.color = 'var(--red)';
    textEl.textContent = 'Exited';
  }
}

function clearTerminal() {
  if (TERMINAL.term) TERMINAL.term.clear();
}

// ── URL Detection (catches long wrapped URLs in terminal output) ────
var _urlBuf = '';
var _urlToastTimer = null;
var _lastShownLen = 0;
var _autoScrollSent = false;

function detectUrl(chunk) {
  // Strip ANSI escape codes and accumulate
  var clean = chunk.replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '');
  _urlBuf += clean;
  // Keep only last 8KB
  if (_urlBuf.length > 8192) _urlBuf = _urlBuf.slice(-8192);

  // Strip pager UI artifacts before URL detection
  var stripped = _urlBuf;
  stripped = stripped.replace(/\(\d+-\d+\s*of\s*\d+\s*lines?\)/gi, ' ');
  stripped = stripped.replace(/shift\+up\/down\s*Navigate/gi, ' ');
  stripped = stripped.replace(/Press\s*q\s*to\s*quit/gi, ' ');
  stripped = stripped.replace(/\(END\)/g, ' ');
  stripped = stripped.replace(/Open\s*this\s*link\s*in\s*the\s*browser[^h]*/gi, ' ');

  // Remove all whitespace/newlines to reassemble wrapped URLs
  var flat = stripped.replace(/[\r\n\s]+/g, '');

  // Match https:// URLs — stop at characters that shouldn't be in URLs
  var matches = flat.match(/https?:\/\/[a-zA-Z0-9\-._~:/?#\[\]@!$&'()*+,;=%]+/g);
  if (!matches) return;

  // Take the longest (most complete) URL found
  var url = matches.reduce(function(a, b) { return a.length >= b.length ? a : b; });

  // Trim trailing artifacts
  url = url.replace(/[)}\]]+$/, '');

  // Skip short URLs
  if (url.length < 40) return;

  // Only track URLs that look like auth URLs (Google OAuth, etc)
  var isAuthUrl = url.indexOf('accounts.google.com') !== -1 || url.indexOf('oauth') !== -1;
  if (!isAuthUrl && url.length < 80) return;

  // Check if URL looks complete (has key OAuth params)
  var looksComplete = !isAuthUrl ||
    (url.indexOf('response_type') !== -1 && url.indexOf('scope') !== -1);

  // Update toast if URL grew longer
  if (url.length > _lastShownLen) {
    _lastShownLen = url.length;
    showUrlToast(url, looksComplete);

    // If URL is incomplete and we haven't auto-scrolled yet, send Down keys to advance pager
    if (!looksComplete && !_autoScrollSent && TERMINAL.ws && TERMINAL.ws.readyState === WebSocket.OPEN) {
      _autoScrollSent = true;
      // Send space/down keys with delay to scroll through the pager
      var scrollCount = 0;
      var scrollInterval = setInterval(function() {
        if (scrollCount >= 15 || !TERMINAL.ws || TERMINAL.ws.readyState !== WebSocket.OPEN) {
          clearInterval(scrollInterval);
          return;
        }
        TERMINAL.ws.send(JSON.stringify({ type: 'input', data: '\x1b[1;2B' })); // shift+down in agy pager
        scrollCount++;
      }, 300);
    }
  }
}

function showUrlToast(url, complete) {
  var toast = $('urlToast');
  toast.href = url;
  if (complete) {
    $('urlToastText').textContent = '\ud83d\udd17 Tap to Open Link';
  } else {
    $('urlToastText').textContent = '\u23f3 Loading full URL...';
  }
  toast.style.display = 'block';

  // Auto-hide after 60s
  if (_urlToastTimer) clearTimeout(_urlToastTimer);
  _urlToastTimer = setTimeout(hideUrlToast, 60000);
}

function hideUrlToast() {
  $('urlToast').style.display = 'none';
  if (_urlToastTimer) { clearTimeout(_urlToastTimer); _urlToastTimer = null; }
  _lastShownLen = 0;
  _autoScrollSent = false;
}

function sendAgyCommand(cmd) {
  if (!TERMINAL.ws || TERMINAL.ws.readyState !== WebSocket.OPEN) return;
  TERMINAL.ws.send(JSON.stringify({ type: 'input', data: cmd + '\r\n' }));
  if (TERMINAL.term) TERMINAL.term.focus();
}

function exitSession() {
  TERMINAL.userExited = true;
  clearTimeout(TERMINAL.reconnectTimer);
  if (TERMINAL.ws && TERMINAL.ws.readyState === WebSocket.OPEN) {
    // Interrupt anything running, then exit agy
    TERMINAL.ws.send(JSON.stringify({ type: 'input', data: '\x03' }));
    setTimeout(function() {
      if (TERMINAL.ws && TERMINAL.ws.readyState === WebSocket.OPEN) {
        TERMINAL.ws.send(JSON.stringify({ type: 'input', data: '/exit\r\n' }));
      }
      setTimeout(function() {
        if (TERMINAL.ws) { TERMINAL.ws.close(); TERMINAL.ws = null; }
        backToLauncher();
      }, 500);
    }, 200);
  } else {
    backToLauncher();
  }
}

function backToLauncher() {
  if (TERMINAL.pingInterval) { clearInterval(TERMINAL.pingInterval); TERMINAL.pingInterval = null; }
  clearTimeout(TERMINAL.reconnectTimer);
  // Reset terminal so next connect starts fresh
  if (TERMINAL.term) TERMINAL.term.clear();
  TERMINAL.reconnectAttempt = 0;
  showPhase('launcher');
}

function sendResize() {
  if (!TERMINAL.ws || TERMINAL.ws.readyState !== WebSocket.OPEN || !TERMINAL.term) return;
  TERMINAL.ws.send(JSON.stringify({
    type: 'resize',
    cols: TERMINAL.term.cols,
    rows: TERMINAL.term.rows,
  }));
}

function setTermFontSize(size) {
  if (TERMINAL.term) {
    TERMINAL.term.options.fontSize = parseInt(size, 10);
    if (TERMINAL.fitAddon) TERMINAL.fitAddon.fit();
    sendResize();
  }
}

function sendVK(seq) {
  if (!TERMINAL.ws || TERMINAL.ws.readyState !== WebSocket.OPEN) return;
  TERMINAL.ws.send(JSON.stringify({ type: 'input', data: seq }));
  // Don't focus terminal — prevents mobile keyboard from popping up
}

function toggleVK(which) {
  if (which === 'ctrl') {
    TERMINAL.ctrlActive = !TERMINAL.ctrlActive;
    $('vkCtrl').classList.toggle('active', TERMINAL.ctrlActive);
    TERMINAL.altActive = false;
    $('vkAlt').classList.remove('active');
  } else {
    TERMINAL.altActive = !TERMINAL.altActive;
    $('vkAlt').classList.toggle('active', TERMINAL.altActive);
    TERMINAL.ctrlActive = false;
    $('vkCtrl').classList.remove('active');
  }
  // Don't focus terminal — prevents mobile keyboard from popping up
}

function toggleKeyboard() {
  if (!TERMINAL.term) return;
  var textarea = TERMINAL.term.textarea;
  if (!textarea) return;
  // Toggle: if textarea is focused, blur it; otherwise focus it
  if (document.activeElement === textarea) {
    textarea.blur();
    $('vkKbd').classList.remove('active');
  } else {
    textarea.focus();
    $('vkKbd').classList.add('active');
  }
}

/* ==========================================================================
   Folder Browser
   ========================================================================== */
var _folderCurrent = '';

function openFolderBrowser() {
  $('folderModal').classList.add('active');
  $('newFolderInput').value = '';
  $('folderCreateError').classList.remove('visible');
  var current = $('workDirInput').value.trim();
  loadFolder(current || null);
}

function closeFolderBrowser() {
  $('folderModal').classList.remove('active');
}

async function loadFolder(path) {
  var list = $('folderList');
  var pathEl = $('folderPath');
  var selectBtn = $('folderSelectBtn');
  var createRow = $('folderCreateRow');
  list.innerHTML = '<div class="folder-loading">Loading</div>';
  pathEl.textContent = 'Loading...';

  try {
    var url = (path !== null && path !== '') ? '/api/browse?path=' + encodeURIComponent(path) : '/api/browse';
    var r = await api(url);
    if (!r.ok) {
      var e = await r.json().catch(function() { return {}; });
      throw new Error(e.detail || 'Failed to browse');
    }
    var data = await r.json();
    _folderCurrent = data.current;
    pathEl.textContent = data.current;

    // Show/hide select button and create row based on depth
    var isRoot = (data.parent === null);
    selectBtn.style.display = isRoot ? 'none' : '';
    createRow.style.display = isRoot ? 'none' : '';

    list.innerHTML = '';

    if (data.parent !== null && data.parent !== undefined) {
      var up = document.createElement('button');
      up.className = 'folder-item up-dir';
      up.innerHTML = '<span class="folder-item-icon">\u2B06\uFE0F</span> ..';
      up.onclick = function() { loadFolder(data.parent || null); };
      list.appendChild(up);
    }

    if (data.directories.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'folder-empty';
      empty.textContent = isRoot ? 'No projects configured in ALLOWED_DIRS' : 'Empty folder';
      list.appendChild(empty);
      return;
    }

    data.directories.forEach(function(dir) {
      var item = document.createElement('button');
      item.className = 'folder-item';
      item.innerHTML = '<span class="folder-item-icon">\uD83D\uDCC1</span> ' + escapeHtml(dir.name);
      item.onclick = function() { loadFolder(dir.path); };
      list.appendChild(item);
    });
  } catch (err) {
    list.innerHTML = '<div class="folder-empty">\u26A0 ' + escapeHtml(err.message) + '</div>';
    pathEl.textContent = 'Error';
  }
}

function selectFolder() {
  if (_folderCurrent && _folderCurrent !== 'Projects') {
    $('workDirInput').value = _folderCurrent;
    localStorage.setItem('corvus_workdir', _folderCurrent);
    updateLauncherFolder(_folderCurrent);
    closeFolderBrowser();
    return;
  }
  closeFolderBrowser();
}

/* ── Create New Folder ──────────────────────────────────────────────── */
async function createNewFolder() {
  var name = $('newFolderInput').value.trim();
  var errEl = $('folderCreateError');
  errEl.classList.remove('visible');

  if (!name) {
    errEl.textContent = 'Please enter a folder name';
    errEl.classList.add('visible');
    return;
  }

  if (!_folderCurrent || _folderCurrent === 'Projects') {
    errEl.textContent = 'Navigate into a directory first';
    errEl.classList.add('visible');
    return;
  }

  $('newFolderBtn').disabled = true;

  try {
    var r = await api('/api/browse/mkdir', {
      method: 'POST',
      body: JSON.stringify({ parent: _folderCurrent, name: name }),
    });
    if (!r.ok) {
      var e = await r.json().catch(function() { return {}; });
      throw new Error(e.detail || 'Failed to create folder');
    }
    // Success — reload current folder to show new dir
    $('newFolderInput').value = '';
    loadFolder(_folderCurrent);
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.add('visible');
  } finally {
    $('newFolderBtn').disabled = false;
  }
}

/* ==========================================================================
   Boot
   ========================================================================== */
document.addEventListener('DOMContentLoaded', async function() {
  var saved = localStorage.getItem('corvus_workdir');
  if (saved) $('workDirInput').value = saved;

  // Check for token in URL fragment (#token=xxx)
  var hash = window.location.hash;
  if (hash && hash.indexOf('#token=') === 0) {
    var bootToken = hash.substring(7); // strip '#token='
    // Clear fragment from URL bar immediately (security)
    history.replaceState(null, '', window.location.pathname);
    // Claim the boot token
    await claimAndBoot(bootToken);
  } else if (STATE.token) {
    // Have a saved session token — verify it still works
    try {
      var resp = await fetch('/api/health');
      if (resp.ok) {
        bootApp();
      } else {
        // Token is stale (container restarted)
        localStorage.removeItem('corvus_token');
        STATE.token = '';
      }
    } catch (e) { /* show auth screen */ }
  }

  $('tokenInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') handleAuth(); });

  $('folderModal').addEventListener('click', function(e) {
    if (e.target === this) closeFolderBrowser();
  });

  $('newFolderInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') createNewFolder();
  });
});
</script>
