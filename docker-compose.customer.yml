# ──────────────────────────────────────────────────────────────────────
# CorvusTunnel — Customer Docker Compose Template
# ──────────────────────────────────────────────────────────────────────
# 1. Replace YOUR-LICENSE-KEY-HERE with your license key
# 2. Run: docker compose -f docker-compose.customer.yml up -d
# 3. Scan the QR code to connect
# ──────────────────────────────────────────────────────────────────────

services:
  corvustunnel:
    image: corvustunnel/corvustunnel:latest
    container_name: corvustunnel
    environment:
      - CORVUS_LICENSE_KEY=YOUR-LICENSE-KEY-HERE
    ports:
      - "8000:8000"
    volumes:
      - ./projects:/workspace
      - corvus_home:/home/corvus
    restart: unless-stopped

volumes:
  corvus_home:
